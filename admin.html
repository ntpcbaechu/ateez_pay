<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATEEZ消費金額紀錄 - 管理後台</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 20px; color: #0f172a; }
    .container { width: 95%; max-width: 1400px; margin: 0 auto; }
    
    #login-screen { position: fixed; inset: 0; background: rgba(15,23,42,0.8); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .login-box h2 { margin-top: 0; font-size: 20px; text-align: center; }
    
    .form-control { margin-bottom: 12px; }
    .form-control label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    
    /* 讓輸入框與選單根據內容預設適當大小，不再硬性拉成 100% */
    .form-control input, .form-control select { padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; width: 100%; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }

    #admin-content { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    .card-title { font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #334155; }
    
    .sheet-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
    .sheet-grid .form-control { flex: 1 1 auto; min-width: 110px; }

    .item-card { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px; margin-bottom: 15px; position: relative; }
    
    /* 改用 Flex 排版，短選項自動緊縮，長輸入框彈性伸展 */
    .item-card-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; align-items: flex-end; }
    
    /* 設定不同欄位類型的彈性與寬度限制 */
    .col-event { flex: 2 1 180px; }
    .col-name { flex: 3 1 200px; }
    .col-cat { flex: 0 0 auto; width: fit-content; min-width: 100px; }
    .col-member { flex: 0 0 auto; width: fit-content; min-width: 100px; }
    .col-curr { flex: 0 0 auto; width: fit-content; min-width: 110px; }
    .col-price { flex: 1 1 110px; max-width: 150px; }
    .col-status { flex: 0 0 auto; width: fit-content; min-width: 100px; }

    .inclusions-box { background: #ffffff; border: 1px dashed #cbd5e0; padding: 10px; border-radius: 6px; margin-top: 8px; }
    .inclusion-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    
    .records-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .records-table th, .records-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .records-table th { background: #f8fafc; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>🔒 管理員登入</h2>
    <div class="form-control">
      <label>Email</label>
      <input type="email" id="login-email" value="rkao29@gmail.com">
    </div>
    <div class="form-control">
      <label>密碼</label>
      <input type="password" id="login-password">
    </div>
    <button class="btn" id="login-btn" style="width: 100%;">登入</button>
  </div>
</div>

<div class="container">
  <div id="admin-content">
    <header>
      <h1>ATEEZ 記帳管理後台</h1>
      <div>
        <a href="index.html" class="btn" style="background:#64748b; text-decoration:none;">回前台</a>
        <button class="btn btn-danger" id="logout-btn">登出</button>
      </div>
    </header>

    <div class="card">
      <div class="card-title" id="form-title">⚡ 快速新增訂單/結帳單</div>
      <form id="order-form">
        <input type="hidden" id="editing-key" value="">
        
        <div class="sheet-grid">
          <div class="form-control" style="max-width: 150px;">
            <label>下單日期</label>
            <input type="date" id="order-date" required>
          </div>
          <div class="form-control" style="max-width: 160px;">
            <label>購入平台</label>
            <input type="text" id="platform" placeholder="例如: KOCA">
          </div>
          <div class="form-control" style="max-width: 150px;">
            <label>預計出貨</label>
            <input type="month" id="ship-month">
          </div>
          <div class="form-control" style="max-width: 150px;">
            <label>到貨日期</label>
            <input type="date" id="arrival-date">
          </div>
          <div class="form-control" style="max-width: 110px;">
            <label>運費 (NT$)</label>
            <input type="number" id="shipping-fee" value="0" min="0">
          </div>
          <div class="form-control" style="max-width: 110px;">
            <label>手續費 (NT$)</label>
            <input type="number" id="fee" value="0" min="0">
          </div>
          <div class="form-control" style="max-width: 110px;">
            <label>折扣 (NT$)</label>
            <input type="number" id="discount" value="0" min="0">
          </div>
        </div>

        <label style="font-weight:600; font-size:13px; color:#475569;">📦 訂單商品細項：</label>
        <datalist id="events-list"></datalist>
        
        <div id="items-container" style="margin-top:10px;"></div>
        <button type="button" class="btn" id="add-item-card-btn" style="background:#0284c7; margin-bottom:15px;">+ 新增一個商品卡片</button>

        <div style="padding-top: 15px; border-top: 1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <label><input type="checkbox" id="order-has-poka"> 整筆滿額卡</label>
            <select id="order-poka-member" style="display:none; width:auto; margin-left:10px; padding:4px 8px;"></select>
          </div>
          <div>
            <button type="button" class="btn" id="cancel-edit-btn" style="background:#64748b; display:none;">取消編輯</button>
            <button type="submit" class="btn btn-success" style="padding:10px 24px; font-size:16px;">💾 儲存這筆訂單</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">📜 歷史紀錄管理</div>
      <table class="records-table">
        <thead>
          <tr>
            <th>下單日</th>
            <th>平台</th>
            <th>總金額</th>
            <th>商品與細項</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="admin-records-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZiROSpWeL18xBlmsVc-TKHmDOimPXK0g",
    authDomain: "ateezpay.firebaseapp.com",
    databaseURL: "https://ateezpay-default-rtdb.firebaseio.com",
    projectId: "ateezpay",
    storageBucket: "ateezpay.firebasestorage.app",
    messagingSenderId: "448106458713",
    appId: "1:448106458713:web:9a3e6ed896a4eee7378b48"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let membersData = [];
  let pokaData = [];
  let categoriesList = [];
  let statusesList = [];
  let rawOrdersData = {};

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      loadInitialData();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-content').style.display = 'none';
    }
  });

  document.getElementById('login-btn').addEventListener('click', () => {
    signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
      .catch(err => alert('登入失敗: ' + err.message));
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  async function loadInitialData() {
    try {
      const [r1, r2, r3, r4] = await Promise.all([
        fetch('./json/members.json'),
        fetch('./json/poka.json'),
        fetch('./json/categories.json'),
        fetch('./json/statuses.json')
      ]);
      membersData = await r1.json();
      pokaData = await r2.json();
      const defaultCats = await r3.json();
      const defaultStats = await r4.json();

      onValue(ref(db, 'categories'), (snap) => {
        const fbCats = snap.val() ? Object.values(snap.val()) : [];
        const setMap = new Set([...defaultCats, ...fbCats]);
        if (!setMap.has("其他")) setMap.add("其他");
        categoriesList = Array.from(setMap);
        
        document.querySelectorAll('.item-category').forEach(sel => {
          const cur = sel.value;
          populateOptionsSelect(sel, categoriesList);
          if (cur) sel.value = cur;
        });
      });

      onValue(ref(db, 'statuses'), (snap) => {
        const fbStats = snap.val() ? Object.values(snap.val()) : [];
        const setMap = new Set([...defaultStats, ...fbStats]);
        if (!setMap.has("其他")) setMap.add("其他");
        statusesList = Array.from(setMap);

        document.querySelectorAll('.item-status').forEach(sel => {
          const cur = sel.value;
          populateOptionsSelect(sel, statusesList);
          if (cur) sel.value = cur;
        });
      });

    } catch(e) { console.error(e); }

    onValue(ref(db, 'events'), (snap) => {
      const list = document.getElementById('events-list');
      list.innerHTML = '';
      const events = snap.val() || {};
      Object.values(events).forEach(eName => {
        const opt = document.createElement('option');
        opt.value = eName;
        list.appendChild(opt);
      });
    });

    initForm();
    listenRecords();
  }

  function populateSelect(selectEl, data, defaultTxt = "請選擇") {
    selectEl.innerHTML = `<option value="">${defaultTxt}</option>`;
    data.forEach(item => {
      const val = typeof item === 'string' ? item : (item.name || item.id);
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = val;
      selectEl.appendChild(opt);
    });
  }

  function populateOptionsSelect(selectEl, list) {
    selectEl.innerHTML = '';
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item; opt.textContent = item;
      selectEl.appendChild(opt);
    });
  }

  const itemsContainer = document.getElementById('items-container');

  function createInclusionRow(incContainer, data = {}) {
    const row = document.createElement('div');
    row.className = 'inclusion-row';
    row.innerHTML = `
      <select class="inc-type" style="padding:4px 8px; font-size:12px; width:fit-content;">
        <option value="隨機小卡">隨機小卡</option>
        <option value="海報/摺疊海報">海報/摺疊海報</option>
        <option value="大卡/明信片">大卡/明信片</option>
        <option value="拍立得">拍立得</option>
        <option value="貼紙/書籤">貼紙/書籤</option>
        <option value="其他">其他</option>
      </select>
      <input type="text" class="inc-custom-type" placeholder="自訂種類" style="display:${data.type === '其他' ? 'inline-block' : 'none'}; padding:4px; font-size:12px; width:100px;" value="${data.customType || ''}">
      <span style="font-size:12px;">成員:</span>
      <select class="inc-member" style="padding:4px 8px; font-size:12px; width:fit-content;"></select>
      <button type="button" class="btn btn-danger remove-inc-btn" style="padding:2px 6px; font-size:11px;">✕</button>
    `;

    const typeSel = row.querySelector('.inc-type');
    const customInp = row.querySelector('.inc-custom-type');
    const memberSel = row.querySelector('.inc-member');

    populateSelect(memberSel, membersData);

    if (data.type) typeSel.value = data.type;
    if (data.member) memberSel.value = data.member;

    typeSel.addEventListener('change', () => {
      customInp.style.display = typeSel.value === '其他' ? 'inline-block' : 'none';
    });

    row.querySelector('.remove-inc-btn').addEventListener('click', () => row.remove());
    incContainer.appendChild(row);
  }

  function addItemCard(data = {}) {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-card-row">
        <div class="form-control col-event">
          <label>活動名稱</label>
          <input type="text" class="item-event" list="events-list" placeholder="選擇/輸入" value="${data.eventName || ''}">
        </div>
        <div class="form-control col-name">
          <label>品項名稱</label>
          <input type="text" class="item-name" required placeholder="例如:寫真集" value="${data.name || ''}">
        </div>
        <div class="form-control col-cat">
          <label>分類</label>
          <select class="item-category" required></select>
        </div>
        <div class="form-control item-custom-cat-box" style="display:${data.category === '其他' ? 'block' : 'none'}; flex:0 0 110px;">
          <label>自訂分類</label>
          <input type="text" class="item-custom-category" placeholder="輸入分類" value="${data.customCategory || ''}">
        </div>
        <div class="form-control col-member">
          <label>主成員</label>
          <select class="item-member" required></select>
        </div>
      </div>

      <div class="item-card-row">
        <div class="form-control col-curr">
          <label>幣別</label>
          <select class="item-currency">
            <option value="TWD">台幣 (TWD)</option>
            <option value="KRW">韓幣 (KRW)</option>
            <option value="JPY">日幣 (JPY)</option>
            <option value="USD">美金 (USD)</option>
          </select>
        </div>
        <div class="form-control col-price">
          <label>原幣金額</label>
          <input type="number" class="item-orig-price" placeholder="例如:15000" min="0" value="${data.origPrice !== undefined ? data.origPrice : ''}">
        </div>
        <div class="form-control col-price">
          <label>台幣金額 (NT$)</label>
          <input type="number" class="item-twd-price" placeholder="例如:380" min="0" value="${data.twdPrice !== undefined ? data.twdPrice : ''}">
        </div>
        <div class="form-control col-status">
          <label>狀態</label>
          <select class="item-status" required></select>
        </div>
        <div class="form-control item-custom-status-box" style="display:${data.status === '其他' ? 'block' : 'none'}; flex:0 0 110px;">
          <label>自訂狀態</label>
          <input type="text" class="item-custom-status" placeholder="輸入狀態" value="${data.customStatus || ''}">
        </div>
        <div style="margin-left:auto; margin-bottom:12px;">
          <button type="button" class="btn btn-danger remove-card-btn" style="padding:6px 12px; font-size:12px;">刪除商品</button>
        </div>
      </div>

      <div class="inclusions-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:12px; font-weight:bold; color:#475569;">🎁 拆出/隨機內容配置：</span>
          <button type="button" class="btn add-inc-btn" style="padding:2px 8px; font-size:11px; background:#8b5cf6;">+ 新增隨機內容</button>
        </div>
        <div class="inc-rows-container"></div>
      </div>
    `;

    populateOptionsSelect(card.querySelector('.item-category'), categoriesList.length ? categoriesList : ["專輯","小卡","娃娃","海報","飯拍","其他"]);
    populateOptionsSelect(card.querySelector('.item-status'), statusesList.length ? statusesList : ["已訂購","處理中","集運中","已到貨","交易中","已售出","其他"]);
    populateSelect(card.querySelector('.item-member'), membersData);

    if (data.category) card.querySelector('.item-category').value = data.category;
    if (data.status) card.querySelector('.item-status').value = data.status;
    if (data.member) card.querySelector('.item-member').value = data.member;
    if (data.currency) card.querySelector('.item-currency').value = data.currency;

    const catSel = card.querySelector('.item-category');
    const customCatBox = card.querySelector('.item-custom-cat-box');
    catSel.addEventListener('change', () => customCatBox.style.display = catSel.value === '其他' ? 'block' : 'none');

    const statusSel = card.querySelector('.item-status');
    const customStatusBox = card.querySelector('.item-custom-status-box');
    statusSel.addEventListener('change', () => customStatusBox.style.display = statusSel.value === '其他' ? 'block' : 'none');

    const incContainer = card.querySelector('.inc-rows-container');
    if (data.inclusions && data.inclusions.length > 0) {
      data.inclusions.forEach(inc => createInclusionRow(incContainer, inc));
    } else if (data.hasPoka) {
      createInclusionRow(incContainer, { type: '隨機小卡', member: data.pokaMember });
    }

    card.querySelector('.add-inc-btn').addEventListener('click', () => createInclusionRow(incContainer));
    card.querySelector('.remove-card-btn').addEventListener('click', () => {
      if (itemsContainer.children.length > 1) card.remove();
    });

    itemsContainer.appendChild(card);
  }

  function initForm() {
    document.getElementById('editing-key').value = '';
    document.getElementById('form-title').textContent = '⚡ 快速新增訂單/結帳單';
    document.getElementById('cancel-edit-btn').style.display = 'none';
    itemsContainer.innerHTML = '';
    addItemCard();
    populateSelect(document.getElementById('order-poka-member'), pokaData);
  }

  document.getElementById('add-item-card-btn').addEventListener('click', () => addItemCard());
  document.getElementById('order-has-poka').addEventListener('change', (e) => {
    document.getElementById('order-poka-member').style.display = e.target.checked ? 'inline-block' : 'none';
  });

  document.getElementById('cancel-edit-btn').addEventListener('click', () => {
    document.getElementById('order-form').reset();
    initForm();
  });

  document.getElementById('order-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const items = [];
    let itemsTotalTwd = 0;
    let isValid = true;

    document.querySelectorAll('.item-card').forEach((card, idx) => {
      const name = card.querySelector('.item-name').value.trim();
      const origPrice = card.querySelector('.item-orig-price').value;
      const twdPrice = card.querySelector('.item-twd-price').value;

      if (origPrice === '' && twdPrice === '') {
        alert(`第 ${idx+1} 個商品 (${name}) 請至少填寫「原幣金額」或「台幣金額」其中一種！`);
        isValid = false;
        return;
      }

      const eventName = card.querySelector('.item-event').value.trim();
      if (eventName) {
        set(ref(db, `events/${eventName.replace(/[.#$\[\]]/g, "_")}`), eventName);
      }

      const catVal = card.querySelector('.item-category').value;
      const customCatVal = card.querySelector('.item-custom-category').value.trim();
      if (catVal === '其他' && customCatVal) {
        set(ref(db, `categories/${customCatVal.replace(/[.#$\[\]]/g, "_")}`), customCatVal);
      }

      const statusVal = card.querySelector('.item-status').value;
      const customStatusVal = card.querySelector('.item-custom-status').value.trim();
      if (statusVal === '其他' && customStatusVal) {
        set(ref(db, `statuses/${customStatusVal.replace(/[.#$\[\]]/g, "_")}`), customStatusVal);
      }

      if (twdPrice !== '') itemsTotalTwd += Number(twdPrice);

      const inclusions = [];
      card.querySelectorAll('.inclusion-row').forEach(incRow => {
        inclusions.push({
          type: incRow.querySelector('.inc-type').value,
          customType: incRow.querySelector('.inc-custom-type').value,
          member: incRow.querySelector('.inc-member').value
        });
      });

      items.push({
        eventName: eventName,
        name: name,
        category: catVal,
        customCategory: customCatVal,
        member: card.querySelector('.item-member').value,
        currency: card.querySelector('.item-currency').value,
        origPrice: origPrice !== '' ? Number(origPrice) : '',
        twdPrice: twdPrice !== '' ? Number(twdPrice) : '',
        status: statusVal === '其他' && customStatusVal ? customStatusVal : statusVal,
        customStatus: customStatusVal,
        inclusions: inclusions
      });
    });

    if (!isValid) return;

    const shippingFee = Number(document.getElementById('shipping-fee').value) || 0;
    const fee = Number(document.getElementById('fee').value) || 0;
    const discount = Number(document.getElementById('discount').value) || 0;

    const orderData = {
      orderDate: document.getElementById('order-date').value,
      platform: document.getElementById('platform').value,
      shipMonth: document.getElementById('ship-month').value,
      arrivalDate: document.getElementById('arrival-date').value,
      shippingFee: shippingFee,
      fee: fee,
      discount: discount,
      grandTotal: itemsTotalTwd + shippingFee + fee - discount,
      hasOrderPoka: document.getElementById('order-has-poka').checked,
      orderPokaMember: document.getElementById('order-has-poka').checked ? document.getElementById('order-poka-member').value : '',
      items: items,
      createdAt: Date.now()
    };

    const editKey = document.getElementById('editing-key').value;
    if (editKey) {
      update(ref(db, `orders/${editKey}`), orderData).then(() => {
        alert('訂單修改成功！');
        document.getElementById('order-form').reset();
        initForm();
      });
    } else {
      push(ref(db, 'orders'), orderData).then(() => {
        alert('訂單新增成功！');
        document.getElementById('order-form').reset();
        initForm();
      });
    }
  });

  function listenRecords() {
    onValue(ref(db, 'orders'), (snapshot) => {
      const tbody = document.getElementById('admin-records-tbody');
      tbody.innerHTML = '';
      rawOrdersData = snapshot.val() || {};

      Object.keys(rawOrdersData).reverse().forEach(key => {
        const o = rawOrdersData[key];
        let itemsTxt = (o.items || []).map(i => `${i.eventName ? '['+i.eventName+'] ' : ''}${i.name}(${i.member})`).join(', ');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${o.orderDate || '-'}</td>
          <td>${o.platform || '-'}</td>
          <td>NT$ ${(o.grandTotal || 0).toLocaleString()}</td>
          <td>${itemsTxt}</td>
          <td>
            <button class="btn edit-btn" data-key="${key}" style="padding:4px 8px; font-size:12px; background:#f59e0b;">✏️ 編輯</button>
            <button class="btn btn-danger del-btn" data-key="${key}" style="padding:4px 8px; font-size:12px;">刪除</button>
          </td>
        `;

        tr.querySelector('.edit-btn').addEventListener('click', () => loadOrderToEdit(key));
        tr.querySelector('.del-btn').addEventListener('click', () => {
          if (confirm(`確定刪除此筆紀錄？`)) remove(ref(db, `orders/${key}`));
        });

        tbody.appendChild(tr);
      });
    });
  }

  function loadOrderToEdit(key) {
    const o = rawOrdersData[key];
    if (!o) return;

    document.getElementById('editing-key').value = key;
    document.getElementById('form-title').textContent = '✏️ 編輯訂單/結帳單';
    document.getElementById('cancel-edit-btn').style.display = 'inline-block';

    document.getElementById('order-date').value = o.orderDate || '';
    document.getElementById('platform').value = o.platform || '';
    document.getElementById('ship-month').value = o.shipMonth || '';
    document.getElementById('arrival-date').value = o.arrivalDate || '';
    document.getElementById('shipping-fee').value = o.shippingFee || 0;
    document.getElementById('fee').value = o.fee || 0;
    document.getElementById('discount').value = o.discount || 0;

    document.getElementById('order-has-poka').checked = !!o.hasOrderPoka;
    const pokaSel = document.getElementById('order-poka-member');
    pokaSel.style.display = o.hasOrderPoka ? 'inline-block' : 'none';
    if (o.orderPokaMember) pokaSel.value = o.orderPokaMember;

    itemsContainer.innerHTML = '';
    (o.items || []).forEach(item => addItemCard(item));

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
