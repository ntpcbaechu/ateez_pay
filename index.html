<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ateez_pay - 雲端記帳</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #4a5568; margin-bottom: 20px; }
    .total-card { background: #667eea; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input { flex: 1; min-width: 120px; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    button { background: #48bb78; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #38a169; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    li:last-child { border-bottom: none; }
    .item-name { font-weight: 500; }
    .item-price { color: #e53e3e; font-weight: bold; }
    .delete-btn { background: #e53e3e; padding: 4px 8px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .delete-btn:hover { background: #c53030; }
  </style>
</head>
<body>

<div class="container">
  <h1>ATEEZ_PAY 記錄購買列表</h1>
  
  <div class="total-card">
    總消費金額：NT$ <span id="total">0</span>
  </div>

  <form id="pay-form" class="form-group">
    <input type="text" id="item-name" placeholder="品項名稱 (例: 專輯)" required>
    <input type="number" id="item-price" placeholder="金額" required min="0">
    <button type="submit">新增紀錄</button>
  </form>

  <ul id="item-list"></ul>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 填入你的 ateezpay Firebase 專案設定
  const firebaseConfig = {
    apiKey: "AIzaSyDZiROSpWeL18xBlmsVc-TKHmDOimPXK0g",
    authDomain: "ateezpay.firebaseapp.com",
    databaseURL: "https://ateezpay-default-rtdb.firebaseio.com",
    projectId: "ateezpay",
    storageBucket: "ateezpay.firebasestorage.app",
    messagingSenderId: "448106458713",
    appId: "1:448106458713:web:9a3e6ed896a4eee7378b48"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const itemsRef = ref(db, 'records');

  const form = document.getElementById('pay-form');
  const nameInput = document.getElementById('item-name');
  const priceInput = document.getElementById('item-price');
  const list = document.getElementById('item-list');
  const totalEl = document.getElementById('total');

  // 即時監聽資料庫
  onValue(itemsRef, (snapshot) => {
    list.innerHTML = '';
    let total = 0;
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach((key) => {
        const item = data[key];
        total += Number(item.price);
        
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="item-name">${item.name}</span>
          <div>
            <span class="item-price">NT$ ${item.price}</span>
            <button class="delete-btn" data-key="${key}">刪除</button>
          </div>
        `;
        list.appendChild(li);
      });

      // 綁定刪除功能
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const itemKey = e.target.getAttribute('data-key');
          remove(ref(db, `records/${itemKey}`));
        });
      });
    }

    totalEl.textContent = total;
  });

  // 新增資料
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    push(itemsRef, {
      name: nameInput.value,
      price: priceInput.value,
      timestamp: Date.now()
    });
    nameInput.value = '';
    priceInput.value = '';
  });
</script>

</body>
</html>
